name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  # The one Wrangler version used by the preflight and the deploy, so they cannot differ.
  WRANGLER_VERSION: 4.86.0

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # the same loop an agent runs locally: public hygiene, AGENTS.md check, typecheck, lint, unit tests, build, dist check
      - run: npm run check
      # What the deploy will upload, without credentials: Wrangler reads wrangler.jsonc and dist/, checks the assets and the
      # bindings, and stops. It does not prove the account is ready (Analytics Engine must be enabled on it: see
      # "Before the first deploy" in the README), so that failure is still found only by a real deploy.
      - name: Deploy preflight (dry run, no credentials)
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-out"

  # Pull requests run the fast subset of journeys (FAST in e2e/run.mjs), master runs every journey.
  # The deploy job waits for this job: a master build whose journeys fail is never deployed.
  journeys:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Journeys
        run: node e2e/run.mjs --serve --workers 2 ${{ github.event_name == 'pull_request' && '--fast' || '' }}
        env:
          VDT_PORT: '4317'
          VDT_EVIDENCE: ${{ runner.temp }}/e2e
          VDT_RUN_ID: ci
      - name: Keep the evidence of a failed journey
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journey-evidence
          path: ${{ runner.temp }}/e2e/ci
          retention-days: 7

  # Deploys to Cloudflare only after `check` and `journeys` pass, and only for a push to master in
  # this repository: never for pull requests, never for forks (forks have no secrets anyway).
  deploy:
    needs: [check, journeys]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'Queen-City-Cortex/DoTheHardThing'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GitHub creates this environment on first use, with no protection rules and no secrets of its own (the repository
    # secrets still apply). It gives a deployment history. A required reviewer can be added to it in the repository
    # settings later; nothing here depends on that.
    environment:
      name: production
      url: https://dothehardthing.app
    permissions:
      contents: read
    # One deploy at a time. A newer push waits instead of cancelling a deploy that is already running.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy with Wrangler
        # Pinned Wrangler (WRANGLER_VERSION above). The token and account id exist only in this step's environment.
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify the live site
        # Read-only (GET only, no POST to /api/event): the page is 200 and serves this build's entry script, GET /api/event
        # answers 405 from the Worker, og-image.png, sw.js and the manifest equal this build's, and / gets the headers
        # dist/_headers gives it. --post-deploy makes a manifest or header mismatch a failure (without it they only print
        # PENDING); check:workflows requires it. Retries while the edge catches up.
        run: npm run verify:live -- --retries 10 --post-deploy
